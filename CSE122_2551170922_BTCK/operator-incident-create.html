<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo sự cố - LineWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <section class="banner mb-4">
    <h1 class="h2">🚨 Báo sự cố mới</h1>
    <p class="mb-0">Điền biểu mẫu hoặc để AI giúp phân loại lỗi và mức ưu tiên.</p>
  </section>

  <div class="card"><div class="card-body">
    <form id="form" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="machine" class="form-label">Máy gặp sự cố *</label>
          <select id="machine" class="form-select" required><option value="">-- Chọn máy --</option></select>
          <div class="invalid-feedback">Vui lòng chọn máy.</div>
        </div>
        <div class="col-md-6">
          <label for="title" class="form-label">Tiêu đề *</label>
          <input id="title" class="form-control" required minlength="5" maxlength="80">
          <div class="invalid-feedback">Tiêu đề phải từ 5 ký tự.</div>
        </div>
        <div class="col-12">
          <label for="desc" class="form-label">Mô tả hiện tượng * <small id="count" class="text-muted">0 / 200</small></label>
          <textarea id="desc" class="form-control" rows="4" required minlength="10" maxlength="200" placeholder="VD: Băng tải kêu to và rung mạnh ở đoạn cuối"></textarea>
          <div class="invalid-feedback">Mô tả phải từ 10 ký tự.</div>
        </div>
        <div class="col-md-6">
          <label for="type" class="form-label">Loại lỗi</label>
          <select id="type" class="form-select"><option>Cơ khí</option><option>Điện</option><option>Phần mềm</option><option>An toàn</option></select>
        </div>
        <div class="col-md-6">
          <label for="priority" class="form-label">Mức ưu tiên</label>
          <select id="priority" class="form-select"><option>Thấp</option><option selected>Trung bình</option><option>Cao</option></select>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-primary" id="aiBtn">🤖 AI phân loại</button>
        <button class="btn btn-success" id="send">📨 Gửi báo cáo</button>
      </div>
    </form>
  </div></div>
  <div id="aiBox" class="mt-3"></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  const user = initPage("operator");
  $("machine").innerHTML += DB.get("machines").map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  $("machine").value = new URLSearchParams(location.search).get("machine") || "";   // tự chọn máy khi bấm từ trang trạng thái

  $("desc").oninput = () => $("count").textContent = $("desc").value.length + " / 200";   // bộ đếm ký tự

  // ----- AI-1: phân loại lỗi bằng từ khóa (đơn giản, dễ giải thích) -----
  const KEYWORDS = {
    "Cơ khí": ["kẹt", "rung", "mòn", "kêu", "vòng bi", "băng tải"],
    "Điện": ["điện", "chập", "motor", "nóng", "cảm biến", "cầu dao"],
    "Phần mềm": ["plc", "màn hình", "đơ", "mất kết nối", "lỗi mã"],
    "An toàn": ["khói", "cháy", "nổ", "khét", "rò"]
  };
  const URGENT = ["khói", "cháy", "nổ", "khét", "dừng", "chập"];     // gặp từ này -> ưu tiên Cao

  function classify(n) {
    const text = $("desc").value.toLowerCase();
    if (text.trim().length < 10)                                    // AI thất bại: thiếu dữ liệu
      return { error: "Mô tả quá ngắn (dưới 10 ký tự). Hãy mô tả rõ hơn, ví dụ: máy kêu to và rung mạnh." };
    // Mỗi loại lỗi: đếm xem mô tả chứa bao nhiêu từ khóa của loại đó
    const found = Object.entries(KEYWORDS)
      .map(([type, words]) => ({ type, hits: words.filter(w => text.includes(w)) }))
      .filter(x => x.hits.length)
      .sort((a, b) => b.hits.length - a.hits.length);
    if (!found.length)                                              // AI thất bại: không nhận ra
      return { error: "Không thấy từ khóa nào quen thuộc (kẹt, rung, điện, khói, PLC...) nên chưa phân loại được." };
    const pick = found[n % found.length];                           // "Tạo lại" -> thử loại lỗi tiếp theo
    const urgent = URGENT.some(w => text.includes(w));
    const priority = urgent ? "Cao" : "Trung bình";
    return {
      text: `Loại lỗi: ${pick.type} – Ưu tiên: ${priority}`,
      type: pick.type, priority,
      confidence: Math.min(95, 40 + pick.hits.length * 15),         // 1 từ khóa = 55% (AI chưa chắc chắn)
      reasons: [`Mô tả có từ khóa của nhóm "${pick.type}": ${pick.hits.join(", ")}`,
                urgent ? "Có từ khóa nguy hiểm hoặc dừng máy → ưu tiên Cao" : "Không có từ khóa nguy hiểm → ưu tiên Trung bình"]
    };
  }

  // Điền kết quả AI vào biểu mẫu (dùng cho cả nút Chấp nhận và nút Sửa)
  function applyAI(r) { $("type").value = r.type; $("priority").value = r.priority; }
  $("aiBtn").onclick = () => aiPanel($("aiBox"), classify,
    (text, r) => { applyAI(r); toast("Đã áp dụng gợi ý AI vào biểu mẫu"); },              // Chấp nhận
    false,
    r => { applyAI(r); $("type").focus(); toast("Đã điền gợi ý – bạn chỉnh tiếp trong biểu mẫu", "info"); });   // Sửa

  // ----- Gửi báo cáo: kiểm tra hợp lệ rồi lưu -----
  $("form").onsubmit = e => {
    e.preventDefault();
    e.target.classList.add("was-validated");
    if (!e.target.checkValidity()) return;
    $("send").disabled = true;                          // chống bấm 2 lần
    const list = DB.get("incidents");
    list.unshift({
      id: DB.newId("INC"), machine: $("machine").value, title: $("title").value.trim(), desc: $("desc").value.trim(),
      type: $("type").value, priority: $("priority").value, status: "new",
      reporter: user.username, time: now(), shift: getShift(), cause: "", downtime: 0
    });
    DB.set("incidents", list);
    toast("✅ Đã gửi báo cáo sự cố!");
    setTimeout(() => location.href = "operator-shift-incidents.html", 1000);
  };
</script>

<footer class="text-center py-3 bg-white border-top text-muted mt-auto">CSE122__BTCK_Nhom14</footer>
</body>
</html>
