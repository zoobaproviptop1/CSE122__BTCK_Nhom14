<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng điều khiển ca - LineWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <section class="banner mb-4">
    <h1 class="h2">📊 Bảng điều khiển ca</h1>
    <p class="mb-0">Nắm nhanh số sự cố, việc tồn và để AI tóm tắt ca.</p>
  </section>

  <div class="row g-2 mb-3 align-items-end">
    <div class="col-md-4"><label class="form-label" for="shift">Chọn ca</label>
      <select id="shift" class="form-select"><option value="">Tất cả ca</option><option value="sang">Ca sáng</option><option value="chieu">Ca chiều</option><option value="dem">Ca đêm</option></select></div>
    <div class="col-md-4"><button class="btn btn-primary" id="aiBtn">🤖 AI tóm tắt ca</button></div>
  </div>

  <div class="row g-3 mb-3" id="kpi"></div>
  <div id="aiBox" class="mb-3"></div>

  <div class="row g-3">
    <div class="col-lg-5"><div class="card h-100"><div class="card-body">
      <h2 class="h5">Sự cố theo trạng thái</h2>
      <div class="chart-box" id="chartBox"><canvas id="chart"></canvas></div>
      <div id="empty"></div>
    </div></div></div>
    <div class="col-lg-7"><div class="card h-100"><div class="card-body">
      <h2 class="h5">⏳ Việc tồn cần bàn giao</h2>
      <ul class="list-group" id="open"></ul>
    </div></div></div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  const user = initPage("supervisor");
  let chart;
  const OPEN = ["new", "assigned", "fixing"];
  const getList = () => DB.get("incidents").filter(i => i.status !== "cancelled" && (!$("shift").value || i.shift === $("shift").value));
  const shiftLabel = () => SHIFT[$("shift").value] || "Tất cả ca";

  function render() {
    const list = getList(), open = list.filter(i => OPEN.includes(i.status));
    const down = list.reduce((s, i) => s + (+i.downtime || 0), 0);
    const kpi = [["📋", "Tổng sự cố", list.length], ["⏳", "Chưa xử lý xong", open.length],
                 ["✅", "Hoàn thành", list.filter(i => i.status === "done").length], ["⛔", "Downtime (phút)", down]];
    $("kpi").innerHTML = kpi.map(k => `<div class="col-6 col-lg-3"><div class="card kpi card-hover"><div class="card-body">
      <div>${k[0]} ${k[1]}</div><div class="num">${k[2]}</div></div></div></div>`).join("");

    const keys = ["new", "assigned", "fixing", "done"];
    if (chart) chart.destroy();
    $("chartBox").style.display = list.length ? "" : "none";
    $("empty").innerHTML = list.length ? "" : empty("Ca này chưa có sự cố nào.");
    if (list.length) chart = new Chart($("chart"), { type: "doughnut", data: {
      labels: keys.map(k => STATUS[k][0]),
      datasets: [{ data: keys.map(k => list.filter(i => i.status === k).length), backgroundColor: ["#6c757d", "#0dcaf0", "#ffc107", "#198754"] }] } });

    $("open").innerHTML = open.map(i => `<li class="list-group-item d-flex justify-content-between align-items-center">
      <span>${esc(i.title)}<br><small class="text-muted">${esc(machineName(i.machine))}</small></span>${badge(STATUS, i.status)}</li>`).join("")
      || '<li class="list-group-item text-muted">Không có việc tồn 🎉</li>';
  }

  // ----- AI-2: tóm tắt ca (Tạo lại = đổi giữa bản ngắn và bản chi tiết) -----
  function summarize(n) {
    const list = getList();
    if (!list.length) return { error: "Ca này chưa có sự cố nào nên không đủ dữ liệu để tóm tắt." };
    const open = list.filter(i => OPEN.includes(i.status)), high = open.filter(i => i.priority === "Cao");
    const down = list.reduce((s, i) => s + (+i.downtime || 0), 0);
    const count = {};
    list.forEach(i => count[i.machine] = (count[i.machine] || 0) + 1);
    const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
    const short = `${shiftLabel()}: ${list.length} sự cố, ${open.length} việc tồn (${high.length} ưu tiên Cao), downtime ${down} phút. Máy lỗi nhiều nhất: ${machineName(top[0])} (${top[1]} lần).`;
    const detail = short + "\nViệc tồn cần bàn giao:\n" + (open.map(i => `- ${i.id}: ${i.title} (${machineName(i.machine)}, ${STATUS[i.status][0]})`).join("\n") || "- Không có");
    return { text: n % 2 ? detail : short, confidence: Math.min(95, 50 + list.length * 5),
             reasons: [`Dựa trên ${list.length} sự cố của ${shiftLabel()}`, "Việc tồn = sự cố trạng thái Mới, Đã giao, Đang sửa", "Càng nhiều dữ liệu thì độ tin cậy càng cao"] };
  }
  $("aiBtn").onclick = () => aiPanel($("aiBox"), summarize, text => {
    const notes = DB.get("notes");
    notes.unshift({ id: DB.newId("N"), title: `Tóm tắt ${shiftLabel()} (AI)`, content: text, author: user.username, time: now() });
    DB.set("notes", notes);
    toast("✅ Đã lưu vào Ghi chú bàn giao");
  });

  $("shift").oninput = render;
  render();
</script>

<footer class="app-footer"><div class="container text-center py-3"><p class="mb-0">CSE122__BTCK_Nhom14</p></div></footer>
</body>
</html>
