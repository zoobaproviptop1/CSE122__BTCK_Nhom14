<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử máy - LineWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <section class="banner mb-4">
    <h1 class="h2">📜 Lịch sử sự cố của máy</h1>
    <p class="mb-0">Chọn máy để xem lịch sử, rồi để AI tìm lỗi lặp lại.</p>
  </section>

  <div class="row g-2 mb-3 align-items-end">
    <div class="col-md-6"><label for="machine" class="form-label">Chọn máy</label><select id="machine" class="form-select"></select></div>
    <div class="col-md-6"><button class="btn btn-primary" id="aiBtn">🤖 AI tìm lỗi lặp lại</button></div>
  </div>
  <div id="aiBox" class="mb-3"></div>

  <div class="card"><div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-warning"><tr><th>Mã</th><th>Thời gian</th><th>Sự cố</th><th>Loại</th><th>Nguyên nhân</th><th>Dừng (phút)</th><th>Trạng thái</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div><div id="empty"></div></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  const user = initPage("maintenance");
  $("machine").innerHTML = DB.get("machines").map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  $("machine").value = "M03";                                         // máy có lỗi lặp lại để demo

  const getList = () => DB.get("incidents").filter(i => i.machine === $("machine").value && i.status !== "cancelled");

  function render() {
    const list = getList();
    $("body").innerHTML = list.map(i => `<tr><td>${i.id}</td><td>${i.time}</td><td>${esc(i.title)}</td><td>${esc(i.type)}</td>
      <td>${esc(i.cause || "—")}</td><td>${i.downtime}</td><td>${badge(STATUS, i.status)}</td></tr>`).join("");
    $("empty").innerHTML = list.length ? "" : empty("Máy này chưa có sự cố nào.");
    $("aiBox").innerHTML = "";
  }

  // ----- AI-3: tìm loại lỗi xuất hiện từ 2 lần trở lên -----
  function insight(n) {
    const list = getList(), name = machineName($("machine").value);
    if (list.length < 2) return { error: "Máy này có dưới 2 sự cố nên không đủ dữ liệu để tìm mẫu lỗi lặp lại." };
    const groups = {};
    list.forEach(i => (groups[i.type] = groups[i.type] || []).push(i));
    const rep = Object.entries(groups).filter(([t, a]) => a.length >= 2).sort((a, b) => b[1].length - a[1].length);
    if (!rep.length) return { error: "Các sự cố của máy này thuộc loại khác nhau, chưa thấy mẫu lỗi lặp lại." };
    const [type, arr] = rep[n % rep.length];                          // "Tạo lại" xem loại lỗi lặp khác
    const causes = arr.map(i => i.cause).filter(Boolean), down = arr.reduce((s, i) => s + (+i.downtime || 0), 0);
    return {
      text: `Máy "${name}" lặp lại lỗi loại ${type} ${arr.length} lần (tổng dừng máy ${down} phút).\nNguyên nhân đã ghi: ${causes.join("; ") || "chưa có"}.\nĐề xuất: kiểm tra toàn diện hạng mục ${type} và lên lịch bảo dưỡng phòng ngừa.`,
      confidence: Math.min(95, 40 + arr.length * 20),
      reasons: [`${arr.length}/${list.length} sự cố cùng loại "${type}"`, `Mã sự cố: ${arr.map(i => i.id).join(", ")}`, "Quy tắc: từ 2 lần cùng loại lỗi trở lên = lỗi lặp lại"]
    };
  }

  $("aiBtn").onclick = () => aiPanel($("aiBox"), insight, text => {
    const reports = DB.get("reports");
    reports.unshift({ id: DB.newId("R"), title: "Lỗi lặp lại: " + machineName($("machine").value), content: text, author: user.username, time: now() });
    DB.set("reports", reports);
    toast("✅ Đã lưu vào Báo cáo của quản trị viên");
  });

  $("machine").oninput = render;
  render();
</script>

<footer class="app-footer"><div class="container text-center py-3"><p class="mb-0">CSE122__BTCK_Nhom14</p></div></footer>
</body>
</html>
