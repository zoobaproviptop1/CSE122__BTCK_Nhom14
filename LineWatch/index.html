<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LineWatch - Theo dõi ca sản xuất</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="navbar navbar-dark navbar-lw"><div class="container">
    <a class="navbar-brand" href="index.html">🏭 LineWatch</a>
    <a class="btn btn-warning btn-sm" href="#dangnhap">Đăng nhập</a>
  </div></nav>
</header>

<main class="container py-4">
  <section class="banner hero text-center mb-4">
    <h1 class="display-5 fw-bold">LineWatch</h1>
    <p class="lead mb-0">Theo dõi ca sản xuất và sự cố dây chuyền – thay giấy tờ và tin nhắn rời rạc bằng một nơi duy nhất</p>
  </section>

  <div class="row g-4 mb-4">
    <section class="col-lg-7">
      <img class="img-fluid rounded shadow" alt="Kỹ sư kiểm tra thiết bị trong nhà máy" src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800">
    </section>

    <section class="col-lg-5">
      <div class="card" id="dangnhap"><div class="card-body">
        <h2 class="h4">🔐 Đăng nhập</h2>
        <form id="loginForm">
          <div class="mb-2"><label for="user" class="form-label">Tên đăng nhập</label>
            <input id="user" class="form-control" required></div>
          <div class="mb-2">
            <label for="pass" class="form-label">Mật khẩu</label>
            <div class="input-group">
              <input id="pass" type="password" class="form-control" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Hiện mật khẩu">
                <i class="bi bi-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
          </div>
          <div id="loginErr" class="text-danger" role="alert"></div>
          <button class="btn btn-primary w-100 mt-2">Đăng nhập</button>
        </form>
        <hr>
        <small class="text-muted">Điền nhanh tài khoản demo (vẫn phải bấm Đăng nhập):</small>
        <div class="d-flex flex-wrap gap-1 mt-1" id="quick"></div>
      </div></div>
    </section>
  </div>
</main>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  // Nút điền nhanh tài khoản demo
  $("quick").innerHTML = USERS.map(u =>
    `<button type="button" class="btn btn-sm btn-outline-secondary" data-u="${u.username}" data-p="${u.password}">${ROLE_NAME[u.role]}</button>`).join("");
  $("quick").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    $("user").value = b.dataset.u;
    $("pass").value = b.dataset.p;
  };

  // Nút hiện/ẩn mật khẩu
  const toggleBtn = $("togglePassword");
  const passInput = $("pass");
  const toggleIcon = $("togglePasswordIcon");
  if (toggleBtn && passInput) {
    toggleBtn.onclick = () => {
      const isPassword = passInput.type === "password";
      passInput.type = isPassword ? "text" : "password";
      toggleIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
      toggleBtn.setAttribute("aria-label", isPassword ? "Ẩn mật khẩu" : "Hiện mật khẩu");
    };
  }

  // Đăng nhập: sai thì báo lỗi, đúng thì chuyển tới trang của vai trò
  $("loginForm").onsubmit = e => {
    e.preventDefault();
    const u = login($("user").value.trim(), $("pass").value);
    if (!u) { $("loginErr").textContent = "Sai tên đăng nhập hoặc mật khẩu!"; return; }
    sessionStorage.setItem("lw_user", JSON.stringify({ username: u.username, role: u.role, name: u.name }));
    location.href = HOME[u.role];
  };
</script>

<footer class="app-footer"><div class="container text-center py-3"><p class="mb-0">CSE122__BTCK_Nhom14</p></div></footer>
</body>
</html>
