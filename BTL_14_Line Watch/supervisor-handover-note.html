<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghi chú bàn giao - LineWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <section class="banner mb-4">
    <h1 class="h2">📝 Ghi chú bàn giao ca</h1>
    <p class="mb-0">Ghi lại những việc ca sau cần biết. Bản tóm tắt AI đã lưu cũng nằm ở đây.</p>
  </section>

  <div class="row g-3">
    <div class="col-lg-5"><div class="card"><div class="card-body">
      <form id="noteForm" novalidate>
        <label for="title" class="form-label">Tiêu đề *</label>
        <input id="title" class="form-control mb-2" required minlength="5">
        <div class="invalid-feedback">Tiêu đề phải từ 5 ký tự.</div>
        <label for="content" class="form-label">Nội dung *</label>
        <textarea id="content" class="form-control mb-2" rows="5" required minlength="10"></textarea>
        <div class="invalid-feedback">Nội dung phải từ 10 ký tự.</div>
        <button class="btn btn-primary" id="saveBtn">Lưu ghi chú</button>
        <button type="button" class="btn btn-outline-secondary" onclick="cancelEdit()">Làm mới</button>
      </form>
    </div></div></div>

    <div class="col-lg-7">
      <input id="search" class="form-control mb-3" placeholder="🔍 Tìm ghi chú..." aria-label="Tìm ghi chú">
      <div id="list"></div>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  const user = initPage("supervisor");
  let editId = null;                     // null = đang thêm mới, có giá trị = đang sửa

  function render() {
    const key = $("search").value.toLowerCase();
    const list = DB.get("notes").filter(n => (n.title + n.content).toLowerCase().includes(key));
    $("list").innerHTML = list.map(n => `<div class="card mb-2"><div class="card-body">
      <div class="d-flex justify-content-between flex-wrap"><h5>${esc(n.title)}</h5><small class="text-muted">${n.time} · ${esc(n.author)}</small></div>
      <p style="white-space: pre-line">${esc(n.content)}</p>
      <button class="btn btn-sm btn-outline-primary" onclick="edit('${n.id}')">Sửa</button>
      <button class="btn btn-sm btn-outline-danger" onclick="del('${n.id}')">Xóa</button></div></div>`).join("")
      || empty("Chưa có ghi chú nào.");
  }

  $("noteForm").onsubmit = e => {
    e.preventDefault();
    e.target.classList.add("was-validated");
    if (!e.target.checkValidity()) return;
    const list = DB.get("notes");
    if (editId) {                                     // Sửa
      const n = list.find(x => x.id === editId);
      n.title = $("title").value.trim(); n.content = $("content").value.trim(); n.time = now();
    } else {                                          // Thêm mới
      list.unshift({ id: DB.newId("N"), title: $("title").value.trim(), content: $("content").value.trim(), author: user.username, time: now() });
    }
    DB.set("notes", list);
    toast(editId ? "Đã cập nhật ghi chú" : "Đã thêm ghi chú");
    cancelEdit(); render();
  };

  function edit(id) {
    const n = DB.get("notes").find(x => x.id === id);
    editId = id;
    $("title").value = n.title; $("content").value = n.content;
    $("saveBtn").textContent = "Cập nhật";
    $("title").focus();
  }
  function cancelEdit() {
    editId = null;
    $("noteForm").reset();
    $("noteForm").classList.remove("was-validated");
    $("saveBtn").textContent = "Lưu ghi chú";
  }
  function del(id) {
    if (!confirm("Xóa ghi chú này?")) return;
    DB.set("notes", DB.get("notes").filter(n => n.id !== id));
    toast("Đã xóa ghi chú", "secondary");
    render();
  }

  $("search").oninput = render;
  render();
</script>

<footer class="text-center py-3 bg-white border-top text-muted mt-auto">CSE122__BTCK_Nhom14</footer>
</body>
</html>
