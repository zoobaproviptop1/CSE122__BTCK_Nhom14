<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo cáo downtime - LineWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <section class="banner mb-4">
    <h1 class="h2">📈 Báo cáo downtime</h1>
    <p class="mb-0">Tổng hợp thời gian dừng máy theo từng máy và từng Line.</p>
  </section>

  <div class="row g-2 mb-3 align-items-end">
    <div class="col-md-4"><label class="form-label" for="lineFilter">Line</label>
      <select id="lineFilter" class="form-select"><option value="">Tất cả Line</option></select></div>
    <div class="col-md-8 d-flex gap-2 flex-wrap">
      <button class="btn btn-success" id="csvBtn">⬇ Xuất CSV</button>
      <button class="btn btn-outline-secondary" onclick="window.print()">🖨 In báo cáo</button>
    </div>
  </div>

  <div class="row g-3 mb-3" id="kpi"></div>

  <div class="row g-3 mb-3">
    <div class="col-lg-6"><div class="card h-100"><div class="card-body"><h2 class="h5">Downtime theo máy (phút)</h2><canvas id="chart"></canvas></div></div></div>
    <div class="col-lg-6"><div class="card h-100"><div class="table-responsive">
      <table class="table mb-0 align-middle">
        <thead class="table-primary"><tr><th>Máy</th><th>Line</th><th>Số sự cố</th><th>Downtime</th></tr></thead>
        <tbody id="body"></tbody>
      </table><div id="empty"></div>
    </div></div></div>
  </div>

  <div class="card"><div class="card-body">
    <h2 class="h5">🤖 Báo cáo AI đã lưu (lỗi lặp lại)</h2>
    <div id="reports"></div>
  </div></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  initPage("admin");
  let chart, rows = [];
  $("lineFilter").innerHTML += DB.get("lines").map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");

  // Gom sự cố theo máy: số lần + tổng phút dừng
  function getRows() {
    const incs = DB.get("incidents").filter(i => i.status !== "cancelled"), line = $("lineFilter").value;
    return DB.get("machines").filter(m => !line || m.line === line).map(m => {
      const a = incs.filter(i => i.machine === m.id);
      return { name: m.name, line: lineName(m.line), count: a.length, down: a.reduce((s, i) => s + (+i.downtime || 0), 0) };
    }).filter(r => r.count > 0).sort((a, b) => b.down - a.down);
  }

  function render() {
    rows = getRows();
    const total = rows.reduce((s, r) => s + r.down, 0), cnt = rows.reduce((s, r) => s + r.count, 0);
    const kpi = [["⛔", "Tổng downtime (phút)", total], ["📋", "Tổng sự cố", cnt], ["⏱️", "Trung bình phút/sự cố", cnt ? Math.round(total / cnt) : 0], ["🏆", "Máy dừng nhiều nhất", rows.length ? rows[0].name : "—"]];
    $("kpi").innerHTML = kpi.map(k => `<div class="col-6 col-lg-3"><div class="card kpi card-hover"><div class="card-body"><div>${k[0]} ${k[1]}</div><div class="num fs-4">${esc(k[2])}</div></div></div></div>`).join("");
    $("body").innerHTML = rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.line)}</td><td>${r.count}</td><td><b>${r.down}</b> phút</td></tr>`).join("");
    $("empty").innerHTML = rows.length ? "" : empty("Chưa có dữ liệu downtime cho Line này.");
    if (chart) chart.destroy();
    chart = new Chart($("chart"), { type: "bar", data: { labels: rows.map(r => r.name), datasets: [{ label: "Downtime (phút)", data: rows.map(r => r.down), backgroundColor: "#0d6efd" }] } });
    renderReports();
  }

  function renderReports() {
    const list = DB.get("reports");
    $("reports").innerHTML = list.map(r => `<div class="border rounded p-2 mb-2"><div class="d-flex justify-content-between flex-wrap">
      <b>${esc(r.title)}</b><small class="text-muted">${r.time} · ${esc(r.author)}</small></div>
      <p class="mb-1" style="white-space: pre-line">${esc(r.content)}</p>
      <button class="btn btn-sm btn-outline-danger" onclick="delR('${r.id}')">Xóa</button></div>`).join("")
      || empty("Chưa có báo cáo AI nào. Kỹ thuật bảo trì sẽ lưu từ trang Lịch sử máy.");
  }
  function delR(id) {
    if (!confirm("Xóa báo cáo này?")) return;
    DB.set("reports", DB.get("reports").filter(r => r.id !== id));
    toast("Đã xóa báo cáo", "secondary"); renderReports();
  }

  // Xuất CSV (dữ liệu đang lọc)
  $("csvBtn").onclick = () => {
    const lines = [["Máy", "Line", "Số sự cố", "Downtime (phút)"], ...rows.map(r => [r.name, r.line, r.count, r.down])];
    const csv = "﻿" + lines.map(l => l.join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "downtime.csv";
    a.click();
  };

  $("lineFilter").oninput = render;
  render();
</script>

<footer class="text-center py-3 bg-white border-top text-muted mt-auto">CSE122__BTCK_Nhom14</footer>
</body>
</html>
