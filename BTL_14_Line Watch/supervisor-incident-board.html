<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng sự cố - LineWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <section class="banner mb-4">
    <h1 class="h2">🗂️ Bảng điều phối sự cố</h1>
    <p class="mb-0">Chọn trạng thái ở từng thẻ để giao việc cho bảo trì hoặc đóng sự cố.</p>
  </section>

  <div class="card mb-3"><div class="card-body row g-2 align-items-end">
    <div class="col-md-6"><label class="form-label" for="search">Tìm sự cố / máy</label><input id="search" class="form-control" placeholder="Gõ từ khóa..."></div>
    <div class="col-md-4"><label class="form-label" for="pri">Ưu tiên</label>
      <select id="pri" class="form-select"><option value="">Tất cả</option><option>Cao</option><option>Trung bình</option><option>Thấp</option></select></div>
  </div></div>

  <div class="row g-3" id="board"></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  initPage("supervisor");
  const COLS = ["new", "assigned", "fixing", "done"];

  const card = i => `<div class="border rounded p-2 bg-white">
    <b>${esc(i.title)}</b><br><small class="text-muted">${esc(machineName(i.machine))} · ${i.time}</small>
    <div class="my-1">${priBadge(i.priority)}</div>
    <select class="form-select form-select-sm" aria-label="Đổi trạng thái ${i.id}" onchange="move('${i.id}', this.value)">
      ${COLS.map(c => `<option value="${c}" ${c === i.status ? "selected" : ""}>${STATUS[c][0]}</option>`).join("")}
    </select></div>`;

  function render() {
    const key = $("search").value.toLowerCase(), pri = $("pri").value;
    const list = DB.get("incidents").filter(i => i.status !== "cancelled" && (i.title + machineName(i.machine)).toLowerCase().includes(key) && (!pri || i.priority === pri));
    $("board").innerHTML = COLS.map(c => {
      const items = list.filter(i => i.status === c);
      return `<div class="col-md-6 col-xl-3"><div class="card h-100">
        <div class="card-header bg-${STATUS[c][1]}-subtle fw-bold">${STATUS[c][0]} (${items.length})</div>
        <div class="card-body d-grid gap-2">${items.map(card).join("") || '<small class="text-muted">Trống</small>'}</div></div></div>`;
    }).join("");
  }

  function move(id, status) {
    const list = DB.get("incidents");
    list.find(i => i.id === id).status = status;
    DB.set("incidents", list);
    toast("Đã chuyển sang: " + STATUS[status][0]);
    render();
  }

  $("search").oninput = render;
  $("pri").oninput = render;
  $("board").innerHTML = spinner();
  setTimeout(render, 500);
</script>

<footer class="text-center py-3 bg-white border-top text-muted mt-auto">CSE122__BTCK_Nhom14</footer>
</body>
</html>
